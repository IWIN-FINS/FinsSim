# Infrared camera and robot AprilTag calibration ported from:
# /write_bot_pose.cpp
#
# Source video used by the old C++ code:
# /test.mp4
# OpenCV reported resolution: 2560x1440, approximately 30 fps.
#
# The ROS Python tracker currently uses these parameters for configuration and
# status reporting. Full multi-tag PnP should consume camera_matrix,
# distortion_coefficients, marker_length_m, and tag_transforms_robot.

camera_name: finsrov_overhead_ir_camera
image_width: 2560
image_height: 1440

camera_matrix:
  rows: 3
  cols: 3
  data:
    - 1.133601568364087e+03
    - -0.744532833265443
    - 1.372239661307784e+03
    - 0.0
    - 1.132798445477066e+03
    - 6.814712328352829e+02
    - 0.0
    - 0.0
    - 1.0

distortion_model: plumb_bob
