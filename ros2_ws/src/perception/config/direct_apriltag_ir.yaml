direct_apriltag_node:
  ros__parameters:
    device: /dev/v4l/by-id/usb-Generic_LRCP_USB3.0__U_200901010001-video-index0
    width: 2560
    height: 1440
    fps: 25.0
    fourcc: MJPG

    family: tag25h9
    tag_families:
      - tag25h9
    target_tag_id: -1
    target_tag_ids: [2, 3, 4]
    max_hamming: 0
    nthreads: 4
    quad_decimate: 2.0
    quad_sigma: 0.0
    refine_edges: true
    decode_sharpening: 0.25

    # RGB E2 homography is not valid for this 2560x1440 IR camera. Keep the
    # legacy debug mapping explicitly isolated until an IR-specific dataset is
    # calibrated and validated.
    homography_file: calibration/pool_homography_ir_unverified.yaml
    camera_calibration_file: calibration/ir_apriltag_camera.yaml
    marker_length_m: 0.098
    publish_pnp_pose: true
    pnp_pose_topic: /finsrov/vision/pose_3d_camera
    pnp_array_topic: /finsrov/vision/tag_poses_3d_camera
    detection2d_topic: /finsrov/vision/tag_detections_2d
    pnp_frame_id: finsrov_overhead_ir_camera
    pnp_covariance_xyz: 0.0025

    status_topic: /finsrov/vision/status
    camera_status_topic: /finsrov/camera/status
    debug_image_topic: /finsrov/camera/debug/compressed

    dataset_root: artifacts/datasets/apriltag_pnp_truth
    dataset_capture_request_topic: /finsrov/dataset/capture_request
    dataset_capture_result_topic: /finsrov/dataset/capture_result
    dataset_truth_frame_id: pool_world

    debug_image_enabled: true
    debug_image_rate_hz: 5.0
    debug_image_width: 640
    debug_jpeg_quality: 80
    status_rate_hz: 5.0
