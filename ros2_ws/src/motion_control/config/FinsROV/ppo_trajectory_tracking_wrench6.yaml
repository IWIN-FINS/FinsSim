motion_controller:
  ros__parameters:
    vehicle_name: FinsROV
    backend_name: ppo_trajectory_tracking_wrench6
    # Replace after the corresponding T2-wrench6 training run completes.
    checkpoint_path: "./artifacts/runs/rl/trajectory_tracking/wrench6/ppo_trajectory_tracking_fossen_parallel_30s/checkpoints/best_model.zip"
    device: cuda
    control_rate_hz: 10.0
    control_mode: ros_manual
    controller_frame_id: controller_world
    ros_to_controller_basis_indices: [0, 2, 1]
    ros_to_controller_basis_signs: [1.0, 1.0, 1.0]
    thruster_topic: /finsrov/thrusters_out
    thruster_output_mode: wrench6d_force_n
    thruster_force_limits_n:
      positive: [8.4749, 7.3809, 7.3809, 8.4749, 7.3809, 8.4749, 7.3809, 8.4749]
      negative: [7.9750, 5.7618, 5.7618, 7.9750, 5.7618, 7.9750, 5.7618, 7.9750]
    wrench6d:
      allocation_mode: physical_wrench_allocator
      # T2 policy output already uses [Fx,Fy,Fz,Mx,My,Mz].
      policy_axis_order: allocator_body
      wrench_limits: [19.528527, 18.415027, 22.501886, 3.863995, 3.079985, 7.080833]
      # allocator_body is [Fx,Fy,Fz,Mx,My,Mz] on [forward,up,left].
      # The deployed T2 protocol tracks x/y/z only.  The checkpoint still
      # emits a 6D action, but all rotational channels are zeroed here; there
      # is no commanded yaw, roll, or pitch reference in a hardware trial.
      wrench_scale: [0.1, 0.1, 0.1, 0.0, 0.0, 0.0]
    pose_topic: /finsrov/controller/pose
    imu_topic: /finsrov/controller/imu
    depth_topic: /finsrov/controller/depth
    dvl_topic: /finsrov/controller/dvl
    state_status_topic: /finsrov/controller/state/status
    require_fusion_ready: true
    allowed_vision_modes: [fresh, coast]
    command_trajectory_topic: /motion_controller/command/trajectory
    command_cancel_topic: /motion_controller/command/cancel
    debug_observation_topic: /motion_controller/debug/observation
    debug_action_topic: /motion_controller/debug/policy_action
    debug_wrench6d_topic: /motion_controller/debug/wrench6d
    debug_thruster_command_topic: /motion_controller/debug/thruster_command
    debug_trajectory_reference_topic: /motion_controller/debug/trajectory_reference
    trajectory30:
      preview_step_sec: 0.1
      preview_offset_scale: 3.0
      linear_velocity_scale: 1.0
      angular_velocity_scale: 1.0
      observation_clip: 2.0
