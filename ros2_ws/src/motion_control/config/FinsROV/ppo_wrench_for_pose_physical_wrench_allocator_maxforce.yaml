# Real-vehicle deployment profile for a checkpoint trained from
# configs/rl/pose_control/ppo_wrench_for_pose_fossen_physical_wrench_allocator.yaml.
#
# This profile is intentionally separate from ppo_wrench_for_pose.yaml. That
# older profile loads a checkpoint trained with the empirical mixer, so swapping
# its allocator would change the meaning of every learned action.
motion_controller:
  ros__parameters:
    vehicle_name: FinsROV
    backend_name: ppo_wrench_for_pose_physical_wrench_allocator
    # checkpoint_path: "./artifacts/runs/rl/hold_for_position/physical_wrench_allocator/isaac_reward_new_wrench/checkpoints/best_model.zip"
    # checkpoint_path: "./artifacts/runs/rl/hold_for_position/physical_wrench_allocator/refined_reward_new_wrench/checkpoints/best_model.zip"
    # checkpoint_path: "./artifacts/runs/rl/hold_for_position/physical_wrench_allocator/ppo_wrench_for_hold_position_fossen_parallel_1024_30s_learn_to_swim_dr/checkpoints/best_model.zip"
    checkpoint_path: "./artifacts/runs/rl/hold_for_position/physical_wrench_allocator/ppo_wrench_for_hold_position_fossen_parallel_1024_30s_learn_to_swim_dr_maxforce_mode1/checkpoints/best_model.zip"
    #checkpoint_path: "./artifacts/runs/rl/hold_for_position/physical_wrench_allocator/ppo_wrench_for_hold_position_fossen_parallel_1024_30s_mode3_near_goal_damping_actor_init/checkpoints/best_model.zip"
    # checkpoint_path: "./artifacts/runs/rl/hold_for_position/physical_wrench_allocator/ppo_hold_for_position_equivalent_box_parallel_1024_30s_wrench6/checkpoints/best_model.zip"
    #checkpoint_path: "./artifacts/runs/rl/hold_for_position/physical_wrench_allocator/ppo_hold_for_position_equivalent_box_parallel_1024_30s_wrench6_v2/checkpoints/best_model.zip"
    device: cuda
    control_rate_hz: 10.0
    policy_action_rate_limit_per_sec: 0.0 # 禁用
    position_tolerance: 0.1
    orientation_tolerance_deg: 10.0
    velocity_tolerance: 0.05
    use_target_orientation: true
    stop_on_goal_reached: true
    goal_reach_hold_time_sec: 10.0
    controller_frame_id: controller_world
    control_mode: ros_manual
    control_mode_topic: /motion_controller/control_mode

    ros_to_controller_basis_indices: [0, 2, 1]
    ros_to_controller_basis_signs: [1.0, 1.0, 1.0]
    ros_to_controller_position_offset: [0.0, 0.0, 0.0]



    thruster_topic: /finsrov/thrusters_out
    thruster_output_mode: wrench6d_force_n
    # Canonical order: [V_LF, V_LB, V_RB, V_RF, H_LF, H_LB, H_RB, H_RF].
    # These real-force limits are also used as the bounded allocation limits.
    thruster_force_limits_n:
      positive: [8.4749, 7.3809, 7.3809, 8.4749, 7.3809, 8.4749, 7.3809, 8.4749]
      negative: [7.9750, 5.7618, 5.7618, 7.9750, 5.7618, 7.9750, 5.7618, 7.9750]

    # Policy order: [surge, sway, heave, roll, pitch, yaw].
    # Units: [N, N, N, N*m, N*m, N*m].  Each value is the symmetric pure-axis
    # capability derived from the real per-thruster limits, so action +/-1 is
    # feasible without requiring a second, hidden gain.
    wrench6d:
      allocation_mode: physical_wrench_allocator
      wrench_limits: [19.528527, 18.415027, 22.501886, 3.863995, 3.079985, 7.080833]
      # Per-axis multiplier applied directly to the normalized model output
      # in policy order [surge, sway, heave, roll, pitch, yaw].
      # wrench_scale: [0.1, 0.1, 0.1, 0.0, 0.0, 0.01]
      wrench_scale: [0.1,0.1,0.3, 0.0, 0.0, 0.1]
      #wrench_scale: [1.0,1.0,1.0, 0.0, 0.0, 0.1]

    pose_topic: /finsrov/controller/pose
    imu_topic: /finsrov/controller/imu
    depth_topic: /finsrov/controller/depth
    dvl_topic: /finsrov/controller/dvl
    state_status_topic: /finsrov/controller/state/status
    require_fusion_ready: true
    state_timeout_sec: 0.5
    allowed_vision_modes: [fresh, coast]

    command_position_world_topic: /motion_controller/command/position_controller_world
    command_position_body_topic: /motion_controller/command/position_controller_body
    command_pose_body_topic: /motion_controller/command/pose_controller_body
    command_velocity_body_topic: /motion_controller/command/velocity_controller_body
    command_cancel_topic: /motion_controller/command/cancel
    reset_topic: /finsrov/reset
    reset_service_name: /motion_controller/reset_vehicle
    status_active_pose_topic: /motion_controller/status/active_pose
    status_error_body_topic: /motion_controller/status/error_body
    status_reached_topic: /motion_controller/status/reached
    debug_observation_topic: /motion_controller/debug/observation
    debug_action_topic: /motion_controller/debug/action
    debug_wrench6d_topic: /motion_controller/debug/wrench6d
    debug_thruster_command_topic: /motion_controller/debug/thruster_command
    debug_policy_info_topic: /motion_controller/debug/policy_info

    pose16_rot6d:
      position_scale: 3.0
      linear_velocity_scale: [1.0, 1.0, 1.0]
      angular_velocity_scale: [1.0, 1.0, 1.0]
      velocity_clip: 2.0
