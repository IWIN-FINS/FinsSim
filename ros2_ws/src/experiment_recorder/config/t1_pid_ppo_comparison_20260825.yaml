schema_version: 1
analysis_id: T1-static-water-PID-PPO-comparison-20260825
description: >-
  Frozen target-level comparison of the completed 2026-08-25 T1 static-water
  batches. The comparison uses the identical late-hold interval (40--60 s
  after the controller-world hold start) for every selected trial.

# This is a generated-analysis destination, never a raw experiment directory.
output_directory: ros2_ws/data/experiments/analysis/T1_static_water_pid_ppo_20260825

target_ids:
  - P01_front_left_shallow
  - P02_front_right_shallow
  - P03_rear_right_shallow
  - P04_rear_left_shallow
  - P05_front_left_deep
  - P06_front_right_deep
  - P07_rear_right_deep
  - P08_rear_left_deep

domains:
  hardware:
    state_semantics: fused_controller_world_estimate
    methods:
      PID:
        label: PID
        action_interface: closed_loop_pid_to_bounded_canonical_thruster8
        run_directory: ros2_ws/data/experiments/hardware/T1/PID/20260825_195017_T1-HW-PID-PPO_traditional_pid_position_yaw
        expected_target_ids: [P01_front_left_shallow, P02_front_right_shallow, P03_rear_right_shallow, P04_rear_left_shallow, P05_front_left_deep, P06_front_right_deep, P07_rear_right_deep, P08_rear_left_deep]
      PPO_WRENCH6:
        label: PPO-Wrench6
        action_interface: normalized_wrench6_to_bounded_allocator_to_canonical_thruster8
        run_directory: ros2_ws/data/experiments/hardware/T1/PPO_WRENCH6/20260825_193357_T1-HW-PID-PPO_ppo_wrench_for_pose_physical_wrench_allocator
        expected_target_ids: [P01_front_left_shallow, P02_front_right_shallow, P03_rear_right_shallow, P04_rear_left_shallow, P05_front_left_deep, P06_front_right_deep, P07_rear_right_deep, P08_rear_left_deep]
      PPO_THRUSTER8:
        label: PPO-Thruster8 (reprojected)
        action_interface: source_thruster8_to_wrench_projection_to_bounded_allocator_to_canonical_thruster8
        run_directory: ros2_ws/data/experiments/hardware/T1/PPO_THRUSTER8/20260825_191145_T1-HW-PID-PPO_ppo_control_for_pose_dr_reprojected_physical_wrench_allocator
        expected_target_ids: [P01_front_left_shallow, P02_front_right_shallow, P03_rear_right_shallow, P04_rear_left_shallow, P05_front_left_deep, P06_front_right_deep, P07_rear_right_deep, P08_rear_left_deep]

  simulation:
    state_semantics: unity_controller_world_truth
    methods:
      PID:
        label: PID
        action_interface: closed_loop_pid_to_bounded_canonical_thruster8
        run_directory: ros2_ws/data/experiments/T1_simulation/PID/20260825_203917_E5-T1-UNITY-ROS2_traditional_pid_position_yaw_sim
        expected_target_ids: [P01_front_left_shallow, P02_front_right_shallow, P03_rear_right_shallow, P04_rear_left_shallow, P05_front_left_deep, P06_front_right_deep, P07_rear_right_deep, P08_rear_left_deep]
      PPO_WRENCH6:
        label: PPO-Wrench6
        action_interface: normalized_wrench6_to_training_allocator_to_canonical_thruster8
        run_directory: ros2_ws/data/experiments/simulation/T1/PPO_WRENCH6/20260825_204258_E5-T1-UNITY-ROS2_ppo_wrench6_physical_allocator_sim
        expected_target_ids: [P01_front_left_shallow, P02_front_right_shallow, P03_rear_right_shallow, P04_rear_left_shallow, P05_front_left_deep, P06_front_right_deep, P07_rear_right_deep, P08_rear_left_deep]
      PPO_THRUSTER8:
        label: PPO-Thruster8 (raw direct)
        action_interface: raw_canonical_thruster8_direct_force_request_to_unity
        run_directory: ros2_ws/data/experiments/T1_simulation/PPO_THRUSTER8/20260825_204543_E5-T1-UNITY-ROS2_ppo_thruster8_raw_action_sim
        expected_target_ids: [P01_front_left_shallow, P02_front_right_shallow, P03_rear_right_shallow, P04_rear_left_shallow, P05_front_left_deep, P06_front_right_deep, P07_rear_right_deep, P08_rear_left_deep]

comparability_notes:
  - All selected trials are static-water, one completed repeat per target, and use the same late-hold timing window.
  - Hardware metrics use the fused controller-world estimate; simulation metrics use Unity controller-world truth. Do not treat their difference as a pure sim-to-real dynamics gap.
  - The hardware PPO-Thruster8 deployment reprojects its source eight-thruster action through the physical wrench allocator, while the simulation PPO-Thruster8 condition keeps raw direct force requests. They are distinct execution conditions and must not be presented as an interchangeable checkpoint deployment.
  - PID and PPO retain their frozen source control rates. This is an operational controller comparison, not a rate-matched control-rate ablation.
