schema_version: 1
description: >-
  Recording profiles for the current paper experiments. This file describes
  collection metadata only; it does not select controller gains or enable
  hardware output.

experiments:
  E1:
    name: apriltag_fixed_pose_accuracy
    recorder_profile: apriltag
    required_external_truth: true
    evaluated_dimensions: [pool_world_x, pool_world_y]
    excluded_dimensions: [depth, yaw]
    recommended_pose_count: 12
    repeats_per_pose: 3
    seconds_per_pose: 15
  E2:
    name: apriltag_snell_pinhole_fusion_ablation
    recorder_profile: apriltag
    source_session: E1
    evaluated_dimensions: [pool_world_x, pool_world_y]
    excluded_dimensions: [depth, yaw]
    offline_only: true
  E4:
    name: surge_sway_depth_yaw_response
    recorder_profile: t1
    protocol_config: ros2_ws/src/experiment_recorder/config/t1_hardware_experiment.yaml
    axes: [Fx, Fy, Fz, My]
    levels_per_sign: 3
    repeats_per_level: 3
  E5:
    name: t1_simulation_pid_ppo
    recorder_profile: t1_sim
    protocol_config: ros2_ws/src/experiment_recorder/config/t1_hardware_experiment.yaml
    evaluation_manifest_required: true
    episodes_per_seed_and_stratum: 100
  E6:
    name: t1_hardware_pid
    recorder_profile: t1
    protocol_config: ros2_ws/src/experiment_recorder/config/t1_hardware_experiment.yaml
    performance_dimensions: [controller_x, controller_z, controller_y_depth, yaw]
    uncontrolled_attitude_dimensions: [roll, pitch]
    setpoints: [P01_front_left_shallow, P02_front_right_shallow, P03_rear_right_shallow, P04_rear_left_shallow, P05_front_left_deep, P06_front_right_deep, P07_rear_right_deep, P08_rear_left_deep]
    repeats_per_setpoint: 3
    control_duration_sec: 60
    steady_state_window_sec: 20
    settling_hold_sec: 10
  E7:
    name: t1_hardware_ppo
    recorder_profile: t1
    protocol_config: ros2_ws/src/experiment_recorder/config/t1_hardware_experiment.yaml
    performance_dimensions: [controller_x, controller_z, controller_y_depth, yaw]
    uncontrolled_attitude_dimensions: [roll, pitch]
    setpoints: [P01_front_left_shallow, P02_front_right_shallow, P03_rear_right_shallow, P04_rear_left_shallow, P05_front_left_deep, P06_front_right_deep, P07_rear_right_deep, P08_rear_left_deep]
    repeats_per_setpoint: 3
    control_duration_sec: 60
    steady_state_window_sec: 20
    settling_hold_sec: 10
  E9:
    name: t2_simulation_trajectory_tracking
    recorder_profile: t2_sim
    trajectories: [straight, circle, ellipse, lemniscate, figure_eight]
    policy_observation_dim: 30
  E10:
    name: t2_hardware_trajectory_tracking
    recorder_profile: t2
    controllers: [PID_POSITION, PPO_WRENCH6]
    trajectories: [straight, circle, ellipse, lemniscate, figure_eight]
    repeats_per_trajectory_and_controller: 3
