schema_version: 1
description: >-
  Evaluation-only replay of the E2 archived bottom-tag dataset with a
  spatial-subset planar-Snell T_world_camera candidate. This config never
  changes the deployed hardware external-calibration file.

experiment:
  id: E2
  profile: e2_apriltag_native_replay_refit_candidate
  output_root: ros2_ws/data/experiments/E2/candidates

source:
  dataset_root: ${FINSSIM_DATASET_ROOT}/artifacts/datasets/apriltag_pnp_truth
  session_id: "20260701_190100"
  samples_file: samples.csv
  truth_annotation_frame: apriltag_outer_lower_left_calibration_grid
  truth_to_pool_world:
    x_scale: 1.0
    x_offset_m: -2.0
    y_scale: 1.0
    y_offset_m: -1.0
  truth_annotation_to_tag_center:
    x_offset_m: 0.06
    y_offset_m: 0.06
    tag_outer_side_m: 0.12

tag:
  family: tag25h9
  id: 1
  marker_length_m: 0.098

runtime_calibration:
  camera_calibration_file: ros2_ws/src/perception/calibration/rgb_camera.yaml
  # Candidate only; state_fusion_extrinsics.yaml is not overwritten.
  calibrated_extrinsics_file: ros2_ws/data/calibration/t_world_camera/e2_planar_snell_refit_candidate.yaml
  direct_detector_config: ros2_ws/src/perception/config/direct_apriltag_rgb.yaml
  refractive_pose_config: ros2_ws/src/perception/config/refractive_apriltag_rgb.yaml
  pool_homography_file: ros2_ws/src/perception/calibration/pool_homography.yaml

geometry:
  water_surface_z_m: 1.0
  tag_plane_z_m: 0.0
  n_air: 1.0003
  n_water: 1.333
  oracle_pressure_depth_m: 1.0
  oracle_roll_pitch_yaw_rad: [0.0, 0.0, 0.0]

replay:
  rate_hz: 2.0
  startup_wait_sec: 1.5
  completion_grace_sec: 3.0
  max_runtime_sec: 900.0

evaluation:
  evaluated_dimensions: [pool_world_x, pool_world_y]
  statistical_unit: truth_position_mean
  excluded_dimensions: [depth, roll, pitch, yaw, ekf_fusion, full_camera_stream_detection_rate]
  # The candidate's legacy fitting subset was (ix + 2*iy) mod 5 == 0, where
  # ix/iy are derived from the raw 0.2 m calibration grid. The post-replay
  # audit will report this held-out complement separately.
  legacy_refit_training_split:
    annotation_grid_origin_xy_m: [0.2, 0.2]
    annotation_grid_step_m: 0.2
    modulus: 5
    training_remainders: [0]
