[project]
name = "marus-ros2-workspace-env"
version = "0.0.1"
description = "Workspace-wide uv-managed Python environment for marus_ros2"
requires-python = ">=3.10,<3.11"
dependencies = [
  "empy>=3.3,<4",
  "grpcio>=1.48.2,<2",
  "lark>=1.1,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.24,<2",
  "opencv-python>=4.9,<4.11",
  "protobuf>=3.20.3,<3.21",
  "pytest>=8.4.2",
  "PyQt6>=6.7,<6.10",
  "PyYAML>=6,<7",
  "pyserial>=3.5,<4",
  "rospkg>=1.5,<2",
  "setuptools>=68,<81",
  "stable-baselines3>=2.7,<3",
  "pymodbus>=3.6,<4",
  "pygame>=2.5,<3",
  "pyarrow>=17,<22",
  "tensorboard>=2.15,<3",
  "finssim-isaaclab",
]

[tool.uv.sources]
finssim-isaaclab = { path = "../simulators/isaaclab/FinsSimIsaacLab/runtime", editable = true }

[dependency-groups]
dev = [
  "pytest>=8,<9",
]
