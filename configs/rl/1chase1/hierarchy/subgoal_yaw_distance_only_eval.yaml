base_config: hierarchy_chase_subgoal_yaw_physical_wrench_allocator_1chase1

experiment:
  name: 1chase1_hierarchy_subgoal_yaw_distance_only_physical_wrench_allocator_eval
  seed: 42
  tags:
    - rl
    - single_agent
    - 1chase1
    - hierarchy
    - subgoal_yaw
    - traditional_pid
    - physical_wrench_allocator
    - reward_distance_only
    - eval
    - visual
  output_dir: artifacts/evals/rl/1chase1/hierarchy_subgoal_yaw_distance_only_physical_wrench_allocator

reward:
  protocol: one_chase_one_reward_v1
  mode: distance_only
  parameters:
    distance_scale: 0.10
    distance_range: 8.0
    per_step_penalty: -0.0005
    angular_velocity_penalty_scale: 0.001
    action_energy_penalty_scale: 0.0005
    action_delta_penalty_scale: 0.0005
    success_reward: 50.0
    timeout_penalty: -5.0
    out_of_bounds_penalty: -1.0
    capture_distance: 0.8
    stable_capture_relative_speed: 0.35
    stable_capture_steps_required: 5

env:
  unity:
    env_path: ../../artifacts/unity_builds/rl/linux/FinsROV/1Chase1_visual/1Chase1.x86_64
    env_base_port: 19145
    port_offset: 0
    no_graphics: false
    timeout_wait: 600
    environment_parameters:
      finsim_1chase1_observation_mode: 14
    unity_additional_args:
      - -fins-1chase1-mode
      - direct14
    parallel_mode: multi_area

  train:
    num_envs: 1
    time_scale: 1.0
  eval:
    num_envs: 1
    time_scale: 1.0
    mode: asynchronous

trainer:
  backend: rl
  overrides:
    device: cuda
    checkpoint_path: ../../artifacts/runs/rl/1chase1/hierarchy_subgoal_yaw_distance_only_physical_wrench_allocator/checkpoints/best_model.zip
    num_episodes: 3
    window_width: 1280
    window_height: 720

# This is a 4D-policy checkpoint. Do not use a prior 3D hierarchy checkpoint.
