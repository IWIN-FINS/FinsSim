# Short, disposable TrainingAreaReplicator diagnostic.  Do not use for a real run.
base_config: hierarchy_chase_physical_wrench_allocator_1chase1

experiment:
  name: 1chase1_hierarchy_distance_plus_subgoal_2area_smoke
  seed: 42
  tags: [rl, 1chase1, hierarchy, smoke, training_area_replicator]
  output_dir: artifacts/runs/rl/1chase1/hierarchy_smoke_2area

reward:
  protocol: one_chase_one_reward_v1
  mode: distance_plus_subgoal
  parameters:
    distance_scale: 0.08
    distance_range: 8.0
    subgoal_to_prey_scale: 0.04
    subgoal_to_prey_range: 1.5
    subgoal_stale_timeout_sec: 0.5
    per_step_penalty: -0.0005
    angular_velocity_penalty_scale: 0.001
    action_energy_penalty_scale: 0.0005
    action_delta_penalty_scale: 0.0005
    success_reward: 50.0
    timeout_penalty: -5.0
    out_of_bounds_penalty: -1.0
    capture_distance: 0.8
    stable_capture_relative_speed: 0.35
    stable_capture_steps_required: 5

env:
  unity:
    env_path: ../../artifacts/unity_builds/rl/linux/FinsROV/1Chase1_headless/1Chase1.x86_64
    env_base_port: 18105
    port_offset: 0
    no_graphics: true
    timeout_wait: 180
    seed: 42
    environment_parameters:
      finsim_1chase1_observation_mode: 14
    unity_additional_args:
      - -fins-1chase1-mode
      - direct14
    parallel_mode: multi_area
  train:
    num_envs: 2
    time_scale: 10.0
  eval:
    num_envs: 2
    num_episodes: 2
    time_scale: 1.0
    mode: asynchronous

trainer:
  backend: rl
  overrides:
    device: cuda
    overwrite: true
    n_steps: 64
    batch_size: 128
    n_epochs: 1
    total_timesteps: 128
    checkpoint_freq: 128
    eval_freq: 128
