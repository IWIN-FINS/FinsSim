base_config: hierarchy_chase_physical_wrench_allocator_1chase1

experiment:
  name: 1chase1_hierarchy_chase_physical_wrench_allocator_eval
  seed: 42
  tags:
    - rl
    - single_agent
    - 1chase1
    - hierarchy
    - chase
    - eval
    - visual
    - physical_wrench_allocator
  output_dir: artifacts/evals/rl/1chase1/hierarchy_chase_physical_wrench_allocator

env:
  unity:
    env_path: ../../artifacts/unity_builds/rl/linux/FinsROV/1Chase1_visual/1Chase1.x86_64
    # env_path: ./artifacts/unity_builds/rl/linux/FinsROV/1Chase1_visual_light_weight/ControlForPosition_SmoothNearTarget_Manual_10Hz_Server.x86_64
    env_base_port: 16125
    port_offset: 0
    no_graphics: false
    timeout_wait: 600
    environment_parameters:
      finsim_1chase1_reward_profile: 1
    parallel_mode: multi_area

  train:
    num_envs: 1
    time_scale: 1.0
  eval:
    num_envs: 1
    time_scale: 1.0
    mode: asynchronous
trainer:
  backend: rl
  overrides:
    device: cuda
    checkpoint_path: ../../artifacts/runs/rl/1chase1/hierarchy_chase_physical_wrench_allocator/checkpoints/best_model.zip
    num_episodes: 3
    window_width: 1280
    window_height: 720

# 评估用途：
# - 使用 1Chase1 visual build 做少量可视化回放
# - checkpoint_path 来自 physical_wrench_allocator 训练 run 的 best_model.zip
# - 与训练 YAML 共享同一 base_config / direct14 语义
