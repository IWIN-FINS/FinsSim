base_config: ppo_control_for_moving_target_dynamic

experiment:
  name: 1chase1_ppo_chase_14d
  seed: 42
  tags:
    - rl
    - single_agent
    - 1chase1
    - ppo
    - direct_thruster
    - observation14
    - body_frame_xyz_forward_up_left
  output_dir: artifacts/runs/rl/1chase1/ppo_chase_14d

env:
  unity:
    env_path: ../../artifacts/unity_builds/rl/linux/FinsROV/1Chase1_headless/1Chase1.x86_64
    env_base_port: 15125
    port_offset: 0
    no_graphics: true
    timeout_wait: 360
    parallel_mode: multi_area

  train:
    num_envs: 8
    time_scale: 10.0
  eval:
    num_envs: 1
    time_scale: 10.0
    mode: asynchronous
trainer:
  backend: rl
  overrides:
    device: cuda
    overwrite: true

# 1Chase1 observation contract (14D, controller_body):
#   [0:3]   self_linear_velocity_body
#   [3:6]   self_angular_velocity_body
#   [6:9]   fish_relative_position_body
#   [9:12]  fish_relative_velocity_body
#   [12]    distance_to_fish
#   [13]    bearing_to_fish
#
# body frame convention:
#   x = forward
#   y = up
#   z = left
#
# action:
#   8D direct thruster command in [-1, 1]
