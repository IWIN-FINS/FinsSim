base_config: hybrid_pid_pose_residual

experiment:
  name: hybrid_pid_position_dr
  seed: 42
  tags:
    - hybrid_pid
    - position_control
    - domain_randomization

env:
  unity:
    # Build from Unity with:
    # FinsSimLinuxBuild.BuildControlForPositionSmoothNearTargetManualDomainRandomizedWaterServer
    env_path: ./artifacts/unity_builds/rl/linux/ControlForPosition_SmoothNearTarget_Manual_DRWater_10Hz_Server/ControlForPosition.x86_64
    env_base_port: 5355
    port_offset: 0
    seed: 42
    no_graphics: false
    parallel_mode: multi_binary

  train:
    num_envs: 1
    time_scale: 1.0
  eval:
    num_envs: 1
    time_scale: 1.0
    mode: asynchronous
trainer:
  backend: rl
  overrides:
    overwrite: true
