base_config: hybrid_pid_pose_residual_random

experiment:
  name: direct_pid_random
  seed: 42
  tags:
    - direct_pid
    - random_init

env:
  unity:
    env_path: ${FINSSIM_UNITY_ROOT}/RLControl/build/ControlForPosition.x86_64
    env_base_port: 5105
    port_offset: 0
    no_graphics: true
    parallel_mode: multi_binary

  train:
    num_envs: 8
    time_scale: 10.0
  eval:
    num_envs: 1
    time_scale: 10.0
    mode: asynchronous
trainer:
  backend: rl
  overrides:
    overwrite: true
