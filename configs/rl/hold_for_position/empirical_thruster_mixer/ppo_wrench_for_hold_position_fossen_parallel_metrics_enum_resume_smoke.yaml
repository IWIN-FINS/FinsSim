# Temporary two-area resume check for ML-Agents StatsAggregationMethod handling.
# Its output directory is intentionally isolated from the production run.
base_config: ppo_wrench_for_pose_empirical_thruster_mixer

experiment:
  name: ppo_wrench_for_hold_position_fossen_parallel_metrics_enum_resume_smoke
  seed: 42
  tags: [smoke, resume, hold_for_position, metrics, fossen6dof]
  output_dir: artifacts/runs/rl/hold_for_position/wrench/ppo_wrench_for_hold_position_fossen_parallel_metrics_enum_resume_smoke

env:
  unity:
    env_path: ../../artifacts/unity_builds/rl/linux/HoldForPosition_Fossen_Parallel_15s_10Hz_Server/HoldForPosition_Parallel_15s.x86_64
    parallel_mode: multi_area
    seed: 42
    env_base_port: 47205
    port_offset: 0
    no_graphics: true
    timeout_wait: 1200
    environment_parameters:
      finsim_hold.reward.mode: 1.0
  train:
    num_envs: 2
    time_scale: 10.0
  eval:
    num_envs: 1
    time_scale: 1.0
    mode: asynchronous

trainer:
  backend: rl
  overrides:
    device: cuda
    n_steps: 64
    batch_size: 128
    n_epochs: 1
    # One two-area PPO rollout is sufficient to verify resume and parameter delivery.
    total_timesteps: 128
    checkpoint_freq: 128
    # Avoid unrelated asynchronous evaluation work during this metrics smoke test.
    eval_freq: 256
