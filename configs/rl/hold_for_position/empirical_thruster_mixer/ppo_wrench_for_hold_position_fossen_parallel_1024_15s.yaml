# 15 s episodes: MaxStep=750 at 50 Hz physics and a 10 Hz policy.
# 16,384,000 aggregate transitions / 150 policy steps per episode yields
# approximately 109,227 independent DR samples, matching the Isaac WarpAUV
# 400-iteration comparison target.
base_config: ppo_wrench_for_pose_empirical_thruster_mixer

experiment:
  name: ppo_wrench_for_hold_position_fossen_parallel_1024_15s
  seed: 42
  tags: [ppo, hold_for_position, wrench_control, fossen6dof, training_area_replicator, dr_15s]
  output_dir: artifacts/runs/rl/hold_for_position/wrench/ppo_wrench_for_hold_position_fossen_parallel_1024_15s

env:
  unity:
    env_path: ../../artifacts/unity_builds/rl/linux/HoldForPosition_Fossen_Parallel_15s_10Hz_Server/HoldForPosition_Parallel_15s.x86_64
    parallel_mode: multi_area
    env_base_port: 37105
    port_offset: 0
    no_graphics: true
    timeout_wait: 600
  train:
    num_envs: 1024
    time_scale: 10.0
  eval:
    # A separate Unity Player; results aggregate all completed areas.
    num_envs: 1
    time_scale: 10.0
    mode: asynchronous

trainer:
  backend: rl
  overrides:
    device: cuda
    n_steps: 64
    # 64 * 1024 / 4096 = 16 mini-batches per epoch.
    batch_size: 4096
    n_epochs: 10
    # Exactly 250 PPO rollouts of 65,536 aggregate transitions each.
    total_timesteps: 16384000
    # Aggregate transition intervals: 5% save and 2% independent evaluation.
    checkpoint_freq: 819200
    eval_freq: 327680
