# Evaluation for the physical-wrench Learn-to-Swim domain-randomized run.
base_config: ppo_wrench_for_pose_physical_wrench_allocator

experiment:
  name: ppo_wrench_for_hold_position_fossen_parallel_1024_30s_learn_to_swim_dr_eval
  seed: 42
  tags: [ppo, hold_for_position, wrench_control, physical_wrench_allocator, fossen6dof, learn_to_swim, domain_randomization, parallel_1024, 30s, eval]
  output_dir: artifacts/evals/rl/hold_for_position/physical_wrench_allocator/ppo_wrench_for_hold_position_fossen_parallel_1024_30s_learn_to_swim_dr

env:
  unity:
    env_path: ../../artifacts/unity_builds/rl/linux/HoldForPosition_Fossen_Parallel_30s_10Hz_Server/HoldForPosition_Parallel_30s.x86_64
    env_base_port: 68105
    port_offset: 0
    no_graphics: true
    timeout_wait: 1200
    parallel_mode: multi_area
    seed: 42
    environment_parameters:
      # Mode 2: Isaac/WarpAUV-style dense reward used during training.
      finsim_hold.reward.mode: 2.0
  eval:
    num_envs: 1
    num_episodes: 5
    time_scale: 1.0
    mode: asynchronous

trainer:
  backend: rl
  overrides:
    device: cuda
    checkpoint_path: ./artifacts/runs/rl/hold_for_position/physical_wrench_allocator/ppo_wrench_for_hold_position_fossen_parallel_1024_30s_learn_to_swim_dr/checkpoints/best_model.zip
