# Evaluation for the refined-reward physical-wrench HoldForPosition run.
base_config: ppo_wrench_for_pose_physical_wrench_allocator

experiment:
  name: ppo_wrench_for_hold_position_fossen_parallel_1024_30s_refined_reward_eval
  seed: 42
  tags: [ppo, hold_for_position, wrench_control, physical_wrench_allocator, fossen6dof, dr_30s, refined_reward, eval]
  output_dir: artifacts/evals/rl/hold_for_position/physical_wrench_allocator/refined_reward_new_wrench

env:
  unity:
    env_path: ../../artifacts/unity_builds/rl/linux/HoldForPosition_Fossen_Parallel_30s_10Hz_Server/HoldForPosition_Parallel_30s.x86_64
    parallel_mode: multi_area
    seed: 42
    env_base_port: 58115
    port_offset: 0
    no_graphics: true
    timeout_wait: 1200
    environment_parameters:
      # Mode 1: FinsSim extended LearnToSwimGoalHold, not IsaacPositionHold.
      finsim_hold.reward.mode: 1.0
  eval:
    num_envs: 1
    num_episodes: 5
    time_scale: 1.0
    mode: asynchronous

trainer:
  backend: rl
  overrides:
    device: cuda
    checkpoint_path: ./artifacts/runs/rl/hold_for_position/physical_wrench_allocator/refined_reward_new_wrench/checkpoints/best_model.zip
