# Fresh training run for the near-goal action-energy reward. Do not resume the
# pre-change checkpoint: it was optimized without this explicit cost.
base_config: ppo_control_for_pose

experiment:
  name: ppo_control_for_hold_position_fossen_parallel_1024_30s_near_goal_energy
  seed: 42
  tags: [ppo, hold_for_position, eight_thruster, fossen6dof, domain_randomization, parallel_1024, 30s, near_goal_energy]
  output_dir: artifacts/runs/rl/hold_for_position/eight_thruster/ppo_control_for_hold_position_fossen_parallel_1024_30s_near_goal_energy

env:
  unity:
    env_path: ../../artifacts/unity_builds/rl/linux/HoldForPosition_Fossen_Parallel_30s_10Hz_Server/HoldForPosition_Parallel_30s.x86_64
    env_base_port: 63105
    port_offset: 0
    no_graphics: true
    timeout_wait: 1200
    parallel_mode: multi_area
    seed: 42
    environment_parameters:
      finsim_hold.reward.mode: 1.0
      # At the target, 98% thrust costs approximately -0.576 reward/step.
      finsim_hold.reward.near_goal_action_energy_penalty_scale: 0.60
  train:
    num_envs: 1024
    time_scale: 10.0
  eval:
    num_envs: 256
    time_scale: 1.0
    mode: asynchronous

trainer:
  backend: rl
  overrides:
    init_checkpoint: ./artifacts/runs/rl/hold_for_position/physical_wrench_allocator/ppo_wrench_for_hold_position_fossen_parallel_1024_30s_learn_to_swim_dr/checkpoints/best_model.zip
    device: cuda
    n_steps: 64
    batch_size: 8192
    n_epochs: 10
    total_timesteps: 32768000
    checkpoint_freq: 819200
    eval_freq: 163840
