# Direct eight-thruster policy. Unity uses the Learning-to-Swim equivalent-box
# FinsROV backend and 30 s / 1500 physics-step episodes.
base_config: ppo_control_for_pose

experiment:
  name: ppo_hold_for_position_equivalent_box_parallel_1024_30s_8thruster
  seed: 42
  tags: [ppo, hold_for_position, direct_thruster8, learning_to_swim_equivalent_box, parallel_1024, 30s]
  output_dir: artifacts/runs/rl/hold_for_position/eight_thruster/ppo_hold_for_position_equivalent_box_parallel_1024_30s

env:
  unity:
    env_path: ../../artifacts/unity_builds/rl/linux/HoldForPosition_LearningToSwimEquivalentBox_Parallel_1024_30s_8Thruster_Server/HoldForPosition_EquivalentBox_8Thruster.x86_64
    env_base_port: 62005
    port_offset: 0
    no_graphics: true
    timeout_wait: 1200
    parallel_mode: multi_area
    seed: 42
    environment_parameters:
      # Same position-hold reward for both action-space experiments.
      finsim_hold.reward.mode: 1.0
      finsim_hold.reward.near_goal_action_energy_penalty_scale: 0.60
  train:
    num_envs: 1024
    time_scale: 10.0
  eval:
    num_envs: 256
    time_scale: 1.0
    mode: asynchronous

trainer:
  backend: rl
  overrides:
    device: cuda
    n_steps: 64
    batch_size: 8192
    n_epochs: 10
    total_timesteps: 32768000
    checkpoint_freq: 819200
    eval_freq: 163840
