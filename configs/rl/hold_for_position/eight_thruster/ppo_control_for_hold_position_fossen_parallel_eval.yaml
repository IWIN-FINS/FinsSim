base_config: ppo_control_for_pose

experiment:
  name: ppo_control_for_hold_position_fossen_parallel_eval
  seed: 42
  tags: [ppo, hold_for_position, fossen6dof, training_area_replicator, eval]
  output_dir: artifacts/evals/rl/hold_for_position/ppo_control_for_hold_position_fossen_parallel

env:
  unity:
    env_path: ../../artifacts/unity_builds/rl/linux/HoldForPosition_Fossen_Parallel_10Hz_Server/HoldForPosition_Parallel.x86_64
    env_base_port: 37105
    port_offset: 0
    no_graphics: true
    timeout_wait: 600
    parallel_mode: multi_area

  train:
    num_envs: 1
    time_scale: 1.0
  eval:
    num_envs: 1
    time_scale: 1.0
    mode: asynchronous
trainer:
  backend: rl
  overrides:
    checkpoint_path: "./artifacts/runs/rl/hold_for_position/eight_thruster/ppo_control_for_hold_position_fossen_init/checkpoints/best_model.zip"
    device: cuda
