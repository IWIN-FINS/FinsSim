# Registered finssim-rl backend configuration, not a YAML file path.
base_config: ppo_control_for_pose

experiment:
  name: rl_example
  seed: 42
  tags: []

env:
  unity:
    env_path: null
    env_base_port: 5005
    port_offset: 0
    no_graphics: true
    parallel_mode: multi_binary

  train:
    num_envs: 1
    time_scale: 10.0
  eval:
    num_envs: 1
    time_scale: 10.0
    mode: asynchronous
trainer:
  backend: rl
  overrides: {}
