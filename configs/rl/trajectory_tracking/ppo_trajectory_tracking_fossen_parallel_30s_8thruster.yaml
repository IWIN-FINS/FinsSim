base_config: ppo_control_for_pose

experiment:
  name: ppo_trajectory_tracking_fossen_parallel_30s_8thruster
  seed: 42
  tags: [ppo, trajectory_tracking, t2, fossen6dof, direct_thruster8]
  output_dir: artifacts/runs/rl/trajectory_tracking/8thruster/ppo_trajectory_tracking_fossen_parallel_30s

env:
  unity:
    env_path: ../../artifacts/unity_builds/rl/linux/TrajectoryTracking_Fossen_Parallel_30s_Server/TrajectoryTracking.x86_64
    env_base_port: 32105
    port_offset: 0
    no_graphics: true
    timeout_wait: 300
    parallel_mode: multi_area
    seed: 42
    environment_parameters:
      finsim_trajectory_curriculum_stage: 0
  train:
    num_envs: 1024
    time_scale: 10.0
  eval:
    num_envs: 256
    time_scale: 10.0
    mode: asynchronous

trainer:
  backend: rl
  overrides:
    device: cuda
    overwrite: true
    n_steps: 64
    batch_size: 8192
    n_epochs: 10
    total_timesteps: 32768000
