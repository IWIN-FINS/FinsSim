# Evaluation for the direct 8-thruster T2 trajectory-tracking run.
base_config: ppo_control_for_pose

experiment:
  name: ppo_trajectory_tracking_fossen_parallel_30s_8thruster_eval
  seed: 42
  tags: [ppo, trajectory_tracking, t2, fossen6dof, direct_thruster8, eval]
  output_dir: artifacts/evals/rl/trajectory_tracking/8thruster/ppo_trajectory_tracking_fossen_parallel_30s

env:
  unity:
    env_path: ../../artifacts/unity_builds/rl/linux/TrajectoryTracking_Fossen_Parallel_30s_Server/TrajectoryTracking.x86_64
    parallel_mode: multi_area
    seed: 42
    env_base_port: 36125
    port_offset: 0
    no_graphics: false
    timeout_wait: 600
    environment_parameters:
      finsim_trajectory_curriculum_stage: 0
  train:
    num_envs: 1
    time_scale: 1.0
  eval:
    num_envs: 1
    num_episodes: 10
    time_scale: 1.0
    mode: asynchronous

trainer:
  backend: rl
  overrides:
    device: cuda
    checkpoint_path: ../../artifacts/runs/rl/trajectory_tracking/8thruster/ppo_trajectory_tracking_fossen_parallel_30s/checkpoints/best_model.zip
    window_width: 1280
    window_height: 720
