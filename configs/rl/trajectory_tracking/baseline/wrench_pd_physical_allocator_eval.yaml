# Static T2 baseline: 30D trajectory preview PD -> physical wrench allocator
# -> the one Unity scene's canonical 8 thruster actions. No checkpoint is used.
base_config: traditional_trajectory_tracking_wrench_pd

experiment:
  name: trajectory_tracking_baseline_wrench_pd_physical_allocator_eval
  seed: 42
  tags: [rl, trajectory_tracking, t2, baseline, traditional_wrench_pd, physical_wrench_allocator, eval]
  output_dir: artifacts/evals/rl/trajectory_tracking/baseline/wrench_pd_physical_allocator

env:
  unity:
    env_path: ../../artifacts/unity_builds/rl/linux/TrajectoryTracking_Fossen_Parallel_30s_Server/TrajectoryTracking.x86_64
    parallel_mode: multi_area
    seed: 42
    env_base_port: 36105
    port_offset: 0
    no_graphics: false
    timeout_wait: 600
  train:
    num_envs: 1
    time_scale: 1.0
  eval:
    num_envs: 1
    num_episodes: 10
    time_scale: 1.0
    mode: asynchronous

trainer:
  backend: rl
  overrides:
    device: cuda
    control_debug_interval: 100
    window_width: 1280
    window_height: 720
